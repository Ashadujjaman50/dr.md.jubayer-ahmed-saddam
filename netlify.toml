[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Proxy legacy and modern API routes to Netlify Serverless Functions
[[redirects]]
  from = "/api/appointment.php"
  to = "/.netlify/functions/appointment"
  status = 200
  force = true

[[redirects]]
  from = "/api/appointment"
  to = "/.netlify/functions/appointment"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact.php"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Single Page Application (SPA) catch-all
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
